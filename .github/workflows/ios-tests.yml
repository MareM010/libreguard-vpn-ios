name: iOS tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode supporting the existing iOS 26.5 target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, subprocess
          def version(value):
              return tuple(int(part) for part in value.split("."))
          candidates = []
          for app in glob.glob("/Applications/Xcode*.app"):
              developer = app + "/Contents/Developer"
              result = subprocess.run(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], env={**os.environ, "DEVELOPER_DIR": developer}, text=True, capture_output=True)
              if result.returncode == 0 and version(result.stdout.strip()) >= (26, 5):
                  candidates.append((version(result.stdout.strip()), developer))
          if not candidates:
              raise SystemExit("Runner needs Xcode with iOS Simulator SDK >= 26.5. Update the runner without lowering the app deployment target.")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("DEVELOPER_DIR=" + max(candidates)[1] + "\n")
          PY
      - name: Choose compatible iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ["RUNNER_TEMP"] + "/devices.json") as source:
              devices = json.load(source)["devices"]
          choices = []
          for runtime, values in devices.items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(value) for value in runtime.split(".iOS-")[1].split("-"))
              if version < (26, 5):
                  continue
              choices.extend((version, device["udid"]) for device in values if device["isAvailable"] and device["name"].startswith("iPhone"))
          if not choices:
              raise SystemExit("Runner needs an iPhone Simulator runtime >= iOS 26.5.")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("SIMULATOR_ID=" + max(choices)[1] + "\n")
          PY
      - name: Cache pinned OpenSSL framework
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: Vendor/OpenSSL/openssl.xcframework
          key: openssl-3.5.9-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Vendor/OpenSSL/build.py', 'Vendor/OpenSSL/Package.swift') }}
      - name: Build pinned OpenSSL
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: python3 Vendor/OpenSSL/build.py --work-dir "$RUNNER_TEMP/openssl-build"
      - name: Resolve pinned packages
        run: xcodebuild -resolvePackageDependencies -project libreguard-vpn-ios.xcodeproj -scheme libreguard-vpn-ios -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages" -onlyUsePackageVersionsFromResolvedFile
      - name: Build and test
        run: >-
          xcodebuild test
          -project libreguard-vpn-ios.xcodeproj
          -scheme libreguard-vpn-ios
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages"
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -only-testing:libreguard-vpn-iosTests
          -disableAutomaticPackageResolution
          -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult"
          CODE_SIGNING_ALLOWED=NO
      - name: Test disclosure and offline licenses
        run: >-
          xcodebuild test
          -project libreguard-vpn-ios.xcodeproj
          -scheme libreguard-vpn-ios
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages"
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -only-testing:libreguard-vpn-iosUITests/DataUseDisclosureUITests
          -disableAutomaticPackageResolution
          -resultBundlePath "$RUNNER_TEMP/privacy-ui-tests.xcresult"
          CODE_SIGNING_ALLOWED=NO
      - name: Test TunnelKit encryption and protocols
        run: swift test --package-path Vendor/TunnelKit --filter test
      - name: Build Release bundle
        run: >-
          xcodebuild build
          -project libreguard-vpn-ios.xcodeproj
          -scheme libreguard-vpn-ios
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages"
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/release-build"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
      - name: Check Release bundle
        run: python3 scripts/check_release_artifact.py "$RUNNER_TEMP/release-build/Build/Products/Release-iphoneos/libreguard-vpn-ios.app"
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-tests
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ${{ runner.temp }}/privacy-ui-tests.xcresult
          if-no-files-found: ignore
